AWSTemplateFormatVersion: "2010-09-09"
Description: >
  UniSpot - Scalable Campus Events Platform.
  Provisions EC2 (via Launch Template + ASG), an Application Load Balancer,
  DynamoDB, S3 (versioned, private, lifecycle-managed), least-privilege IAM,
  security groups, and CloudWatch monitoring/alarms.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy into (use your account's default VPC for the course project).

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets (in different AZs) for the ALB and Auto Scaling Group.

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t2.micro]
   DeploymentBucketName:
    Type: String
    Description: >
      S3 bucket (must already exist, created separately) holding unispot-app.zip
      that the EC2 user-data script pulls the application code from.

  TrustedSSHCidr:
    Type: String
    Default: ""
    Description: >
      Optional. Only set this if you must allow SSH — a single trusted IP
      in CIDR form (e.g. 41.x.x.x/32). Leave blank to rely on SSM only
      (recommended).

  AlarmNotificationEmail:
    Type: String
    Default: ""
    Description: Optional email for the SNS topic behind the CPU alarm (bonus feature).

Conditions:
  EnableSSH: !Not [!Equals [!Ref TrustedSSHCidr, ""]]
  EnableEmailAlerts: !Not [!Equals [!Ref AlarmNotificationEmail, ""]]

 Resources:
  EventImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "unispot-event-images-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: TransitionOldImagesToIA
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
              - StorageClass: GLACIER
                TransitionInDays: 90
            NoncurrentVersionTransitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
            NoncurrentVersionExpirationInDays: 180
# ---------------------------------------------------------------------
  # DynamoDB — event data
  # ---------------------------------------------------------------------
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UniSpotEvents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true   # bonus: PITR backup
# ---------------------------------------------------------------------
  # IAM — least-privilege EC2 role
  # ---------------------------------------------------------------------
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: UniSpot-EC2-Role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Enables AWS Systems Manager Session Manager instead of SSH
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: UniSpot-S3-ReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadEventImages
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${EventImagesBucket.Arn}/*"
              - Sid: ReadDeploymentArtifact
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${DeploymentBucketName}/*"
        - PolicyName: UniSpot-DynamoDB-ReadWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadEvents
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource: !GetAtt EventsTable.Arn
              - Sid: UpdateRegistrationCount
                Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !GetAtt EventsTable.Arn

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2InstanceRole
 # ---------------------------------------------------------------------
  # Security Groups
  # ---------------------------------------------------------------------
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: UniSpot ALB - allows inbound HTTP from users
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: UniSpot-ALB-SG

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: UniSpot EC2 - only accepts traffic from the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        - !If
          - EnableSSH
          - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: !Ref TrustedSSHCidr
          - !Ref AWS::NoValue
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: UniSpot-EC2-SG

  # ---------------------------------------------------------------------
  # Application Load Balancer
  # ---------------------------------------------------------------------
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: UniSpot-ALB
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets: !Ref SubnetIds

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: UniSpot-TG
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckTimeoutSeconds: 5

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup