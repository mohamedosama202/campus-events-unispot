AWSTemplateFormatVersion: "2010-09-09"
Description: >
  UniSpot - Scalable Campus Events Platform.
  Provisions EC2 (via Launch Template + ASG), an Application Load Balancer,
  DynamoDB, S3 (versioned, private, lifecycle-managed), least-privilege IAM,
  security groups, and CloudWatch monitoring/alarms.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy into (172.31.0.0/16).

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets (in different AZs) for the ALB and Auto Scaling Group.

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t2.micro]

  DeploymentBucketName:
    Type: String
    Description: >
      S3 bucket (must already exist, created separately) holding unispot-app.zip
      that the EC2 user-data script pulls the application code from.

  TrustedSSHCidr:
    Type: String
    Default: ""
    Description: >
      Optional. Only set this if you must allow SSH — a single trusted IP
      in CIDR form (e.g. 41.x.x.x/32). Leave blank to rely on SSM only
      (recommended).

  AlarmNotificationEmail:
    Type: String
    Default: ""
    Description: Optional email for the SNS topic behind the CPU alarm (bonus feature).

Conditions:
  EnableSSH: !Not [!Equals [!Ref TrustedSSHCidr, ""]]
  EnableEmailAlerts: !Not [!Equals [!Ref AlarmNotificationEmail, ""]]

Resources:
  EventImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "unispot-event-images-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: TransitionOldImagesToIA
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
              - StorageClass: GLACIER
                TransitionInDays: 90
            NoncurrentVersionTransitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
            NoncurrentVersionExpirationInDays: 180

  # ---------------------------------------------------------------------
  # DynamoDB — event data
  # ---------------------------------------------------------------------
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UniSpotEvents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------------------------------------------------------------------
  # IAM — least-privilege EC2 role
  # ---------------------------------------------------------------------
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: UniSpot-EC2-Role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Enables AWS Systems Manager Session Manager instead of SSH
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: UniSpot-S3-ReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadEventImages
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${EventImagesBucket.Arn}/*"
              - Sid: ReadDeploymentArtifact
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${DeploymentBucketName}/*"
        - PolicyName: UniSpot-DynamoDB-ReadWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadEvents
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource: !GetAtt EventsTable.Arn
              - Sid: UpdateRegistrationCount
                Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !GetAtt EventsTable.Arn

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2InstanceRole

  # ---------------------------------------------------------------------
  # Security Groups
  # ---------------------------------------------------------------------
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: UniSpot ALB - allows inbound HTTP from users
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: UniSpot-ALB-SG

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: UniSpot EC2 - only accepts traffic from the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        - !If
          - EnableSSH
          - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: !Ref TrustedSSHCidr
          - !Ref AWS::NoValue
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: UniSpot-EC2-SG

  # ---------------------------------------------------------------------
  # Application Load Balancer
  # ---------------------------------------------------------------------
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: UniSpot-ALB
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets: !Ref SubnetIds

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: UniSpot-TG
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckTimeoutSeconds: 5

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------------------------------------------------------------------
  # Launch Template + Auto Scaling Group
  # ---------------------------------------------------------------------
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: UniSpot-LaunchTemplate
      LaunchTemplateData:
        InstanceType: !Ref InstanceType
        ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
        IamInstanceProfile:
          Arn: !GetAtt EC2InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref EC2SecurityGroup
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: UniSpot-WebServer
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            export AWS_REGION=${AWS::Region}
            export DYNAMODB_TABLE_NAME=${EventsTable}
            export S3_BUCKET_NAME=${EventImagesBucket}
            export DEPLOYMENT_BUCKET=${DeploymentBucketName}
            aws s3 cp s3://${DeploymentBucketName}/user-data.sh /tmp/user-data.sh && bash /tmp/user-data.sh

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: UniSpot-ASG
      MinSize: "1"
      DesiredCapacity: "2"
      MaxSize: "4"
      VPCZoneIdentifier: !Ref SubnetIds
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      TargetGroupARNs:
        - !Ref TargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 120
      Tags:
        - Key: Name
          Value: UniSpot-WebServer
          PropagateAtLaunch: true

  CPUScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 50.0
        DisableScaleIn: false

  # ---------------------------------------------------------------------
  # CloudWatch — alarm, optional SNS notification, dashboard
  # ---------------------------------------------------------------------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: EnableEmailAlerts
    Properties:
      TopicName: UniSpot-Alarms

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: EnableEmailAlerts
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmNotificationEmail

  HighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: UniSpot-HighCPU
      AlarmDescription: Average EC2 CPU utilization exceeds 70% for two consecutive periods.
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref AutoScalingGroup
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 70
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !If [EnableEmailAlerts, !Ref AlarmTopic, !Ref AWS::NoValue]
      TreatMissingData: notBreaching

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: UniSpot-Dashboard
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "EC2 Average CPU Utilization",
                "metrics": [["AWS/EC2", "CPUUtilization", "AutoScalingGroupName", "${AutoScalingGroup}"]],
                "period": 300, "stat": "Average", "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "ALB Request Count",
                "metrics": [["AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${ApplicationLoadBalancer.LoadBalancerFullName}"]],
                "period": 300, "stat": "Sum", "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "ALB Healthy vs Unhealthy Hosts",
                "metrics": [
                  ["AWS/ApplicationELB", "HealthyHostCount", "TargetGroup", "${TargetGroup.TargetGroupFullName}", "LoadBalancer", "${ApplicationLoadBalancer.LoadBalancerFullName}"],
                  ["AWS/ApplicationELB", "UnHealthyHostCount", "TargetGroup", "${TargetGroup.TargetGroupFullName}", "LoadBalancer", "${ApplicationLoadBalancer.LoadBalancerFullName}"]
                ],
                "period": 300, "stat": "Average", "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Auto Scaling Group In-Service Instances",
                "metrics": [["AWS/AutoScaling", "GroupInServiceInstances", "AutoScalingGroupName", "${AutoScalingGroup}"]],
                "period": 300, "stat": "Average", "region": "${AWS::Region}"
              }
            }
          ]
        }

Outputs:
  LoadBalancerURL:
    Description: Access UniSpot via this URL (never use an EC2 public IP directly)
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"

  DynamoDBTableName:
    Value: !Ref EventsTable

  S3BucketName:
    Value: !Ref EventImagesBucket

  EC2RoleArn:
    Value: !GetAtt EC2InstanceRole.Arn

  DashboardURL:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=UniSpot-Dashboard"